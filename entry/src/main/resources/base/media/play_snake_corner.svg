<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Left-to-down elbow; every opening matches the straight body's width. -->
  <g fill="#14543D">
    <rect x="0" y="4" width="10" height="8"/>
    <rect x="4" y="6" width="8" height="10"/>
    <rect x="10" y="5" width="1" height="1"/>
  </g>
  <g fill="#2FB97B">
    <rect x="0" y="5" width="9" height="6"/>
    <rect x="5" y="6" width="6" height="10"/>
  </g>
  <g fill="#70E5A0">
    <rect x="0" y="5" width="8" height="1"/>
    <rect x="8" y="6" width="2" height="1"/>
    <rect x="10" y="7" width="1" height="9"/>
    <rect x="3" y="7" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2"/>
  </g>
  <g fill="#219366">
    <rect x="0" y="10" width="5" height="1"/>
    <rect x="5" y="10" width="1" height="6"/>
    <rect x="7" y="8" width="2" height="2"/>
    <rect x="6" y="14" width="2" height="2"/>
  </g>
</svg>
