<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Wide end joins the body on the right; the left end tapers in pixel steps. -->
  <g fill="#14543D">
    <rect x="10" y="4" width="6" height="8"/>
    <rect x="6" y="5" width="4" height="6"/>
    <rect x="3" y="6" width="3" height="4"/>
    <rect x="1" y="7" width="2" height="2"/>
  </g>
  <g fill="#2FB97B">
    <rect x="10" y="5" width="6" height="6"/>
    <rect x="6" y="6" width="4" height="4"/>
    <rect x="3" y="7" width="3" height="2"/>
  </g>
  <g fill="#70E5A0">
    <rect x="10" y="5" width="6" height="1"/>
    <rect x="6" y="6" width="4" height="1"/>
    <rect x="3" y="7" width="3" height="1"/>
    <rect x="12" y="7" width="2" height="2"/>
  </g>
  <g fill="#219366">
    <rect x="10" y="10" width="6" height="1"/>
    <rect x="6" y="9" width="4" height="1"/>
    <rect x="14" y="8" width="2" height="2"/>
  </g>
</svg>
